<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>背景图页面</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: url("https://raw.githubusercontent.com/laptop-14lyc/test.k12media.cn/refs/heads/main/%E5%B1%8F%E5%B9%95%E6%88%AA%E5%9B%BE%202025-04-30%20223111.png") no-repeat center center fixed;
      background-size: cover;
      cursor: none; /* 隐藏鼠标指针 */
    }
  </style>
</head>
<body>
  <script>
    // 禁止鼠标移动
    document.addEventListener('mousemove', function(event) {
      event.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
