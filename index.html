<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>教育大数据分析平台 - 成绩分析报告</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: url("https://github.com/testk12media/test.k12media.cn/blob/main/%E6%88%90%E7%BB%A9.png?raw=true") no-repeat center center fixed;/* 将https开头换成你的成绩单图片 */
      background-size: cover;
      cursor: none; /* 隐藏鼠标指针 */
    }
  </style>
</head>
<body>
  <script>
    // 禁止鼠标移动
    document.addEventListener('mousemove', function(event) {
      event.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
